
name: Extract Godot project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail

          archive="WILD_FISHING_Release_Candidate_v4.zip"
          test -f "$archive"

          mkdir -p /tmp/wild-fishing
          unzip -q -o "$archive" -d /tmp/wild-fishing

          project_file="$(find /tmp/wild-fishing -type f -name project.godot -print -quit)"

          if [ -z "$project_file" ]; then
            echo "project.godot was not found in the archive"
            exit 1
          fi

          project_dir="$(dirname "$project_file")"
          cp -a "$project_dir"/. .

          test -f project.godot

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No project files to add"
            exit 0
          fi

          git commit -m "Extract WILD FISHING Godot project"
          git push

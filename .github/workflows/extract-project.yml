
name: Extract Godot project

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract WILD FISHING
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check ZIP archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="WILD_FISHING_Release_Candidate_v4.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: ZIP archive not found!"
            ls -la
            exit 1
          fi

          echo "ZIP archive found!"

      - name: Extract Godot project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/wild-fishing

          unzip -q -o \
            "WILD_FISHING_Release_Candidate_v4.zip" \
            -d /tmp/wild-fishing

          PROJECT_FILE=$(find /tmp/wild-fishing -type f -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          cp -a "$PROJECT_DIR"/. .

          if [ ! -f project.godot ]; then
            echo "ERROR: Godot project extraction failed!"
            exit 1
          fi

          echo "Godot project successfully extracted!"

      - name: Save project files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No new files to save."
            exit 0
          fi

          git commit -m "Extract WILD FISHING Godot project"
          git push
